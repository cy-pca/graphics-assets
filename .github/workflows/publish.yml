name: publish

# Pack + publish graphics asset recipes to cvcpkg.org. Runs on catx-03 (the
# only runner with the source data staged at /opt/cvc-wasm/scenes/). Manual
# dispatch only — bump cvc_revision in recipe.yaml, push, then dispatch.

on:
  workflow_dispatch:
    inputs:
      recipes:
        description: "Recipes to pack + publish (space-separated)"
        required: true
        default: "scene-austin-south scene-austin-south-web vehicle-humvee"

concurrency:
  group: graphics-assets-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # catx-03. The org runner carries only [self-hosted, Linux, X64]; an extra
    # label here never matches, so the job queues until GitHub auto-cancels it.
    runs-on: [self-hosted, Linux, X64]
    env:
      # Source-of-truth staging tree for scenes + vehicles on catx-03.
      # Each recipe reads its payload from a subtree here.
      STAGE_ROOT: /opt/cvc-wasm/scenes
      SHARED_ROOT: /opt/cvc-wasm/scenes  # sibling shared/ for vehicles
    steps:
      - uses: actions/checkout@v4

      - name: Locate cvcpkg
        run: |
          export PATH="/opt/cvc-wasm/cmake-cvcpkg/bin:$HOME/.local/bin:$PATH"
          command -v cvcpkg >/dev/null || { echo "cvcpkg not on PATH"; exit 1; }
          echo "cvcpkg at $(command -v cvcpkg) ($(cvcpkg --version))"
          echo "/opt/cvc-wasm/cmake-cvcpkg/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Stage payloads under a build dir
        # Each recipe's package: files clause maps to a share/cvc-scenes/
        # subtree. We assemble that tree from the well-known catx-03 mirror
        # (rather than embedding assets in this repo).
        run: |
          set -euo pipefail
          rm -rf stage
          for r in ${{ inputs.recipes }}; do
            dst=stage/$r/share/cvc-scenes
            mkdir -p "$dst"
            case "$r" in
              scene-austin-south)
                # Full bundle: everything under /opt/cvc-wasm/scenes/austin_south/
                mkdir -p "$dst/austin_south"
                cp -r "$STAGE_ROOT/austin_south/." "$dst/austin_south/"
                ;;
              scene-austin-south-web)
                # Slim bundle: terrain + buildings + downscaled satellite + inline humvee
                mkdir -p "$dst/austin_south"
                cp "$STAGE_ROOT/austin_south/terrain.json"   "$dst/austin_south/"
                cp "$STAGE_ROOT/austin_south/buildings.glb"  "$dst/austin_south/"
                # Downscale satellite to 1024^2 if a full-res copy exists;
                # else use whatever's staged. Requires ImageMagick's magick
                # on the runner (already installed via cvcpkg for the cvcgl tests).
                if command -v magick >/dev/null 2>&1 && [ -f "$STAGE_ROOT/austin_south/satellite.png" ]; then
                  magick "$STAGE_ROOT/austin_south/satellite.png" -resize 1024x1024 -strip -quality 85 \
                    "$dst/austin_south/satellite.png"
                else
                  cp "$STAGE_ROOT/austin_south/satellite.png" "$dst/austin_south/"
                fi
                # Inline vehicle so a single --preload-file dir wires up everything
                cp "$SHARED_ROOT/shared/Humvee.glb" "$dst/austin_south/Humvee.glb" 2>/dev/null || true
                ;;
              vehicle-humvee)
                mkdir -p "$dst/shared"
                cp "$SHARED_ROOT/shared/Humvee.glb" "$dst/shared/Humvee.glb"
                ;;
              vehicle-kenney-cars)
                # Kenney Car Kit 3.1 (CC0): the whole models/ set + LICENSE.txt
                mkdir -p "$dst/shared/kenney-cars"
                cp -r "$SHARED_ROOT/shared/kenney-cars/." "$dst/shared/kenney-cars/"
                ;;
              *)
                echo "unknown recipe: $r (add a case above)"; exit 1;;
            esac
          done
          echo "--- staged tree ---"
          find stage -type f | head -20

      - name: Pack + publish
        # Token resolution: a CVCPKG_PUBLISHER_TOKEN repo/org secret wins; when
        # it is unset the empty env var is dropped so cvcpkg falls back to the
        # runner's own ~/.config/cvcpkg/env. Without either, pack succeeds and
        # publish fails with "--token is required" (the artifact below is the
        # belt-and-braces copy for a manual publish).
        env:
          CVCPKG_TOKEN: ${{ secrets.CVCPKG_PUBLISHER_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${CVCPKG_TOKEN:-}" ] || unset CVCPKG_TOKEN
          mkdir -p dist
          for r in ${{ inputs.recipes }}; do
            echo "=== $r ==="
            cvcpkg pack "$r" \
              --recipes-dir recipes --no-default-recipes \
              --from-prefix "stage/$r" \
              --platform any \
              --output-dir dist/
          done
          for f in dist/*.tar.gz; do
            echo "=== publish $(basename "$f") ==="
            # Under the cvc organisation, like everything libcvc publishes.
            # Plain-name installs still resolve org packages, so consumers keep
            # using `cvcpkg install scene-austin-south-web vehicle-humvee`.
            cvcpkg publish "$f" --server https://cvcpkg.org --org cvc
          done

      - name: Upload artifact (belt-and-braces if publish auth fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-asset-bundles
          path: dist/*.tar.gz
          if-no-files-found: warn
