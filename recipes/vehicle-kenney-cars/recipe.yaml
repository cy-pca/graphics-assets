schema_version: 1
recipe:
  name: vehicle-kenney-cars
  upstream_version: "3.1"
  cvc_revision: 2
  maintainer: "cvcpkg group"
  maintainer_email: "info@cvcpkg.org"
  maintainer_url: "https://cvcpkg.org"
  homepage: https://kenney.nl/assets/car-kit
  license: CC0-1.0
  tags: [asset, vehicle, glb, cvcgl, kenney]
  description: >-
    Kenney Car Kit 3.1 as glTF binaries: 50 low-poly vehicles, wheels and
    debris pieces (sedan, suv, van, taxi, police, ambulance, firetruck,
    garbage-truck, tractor variants, race karts, ...), ~5.5 MB total, CC0
    (public domain; crediting Kenney is appreciated but not required). Depends
    on nothing; installed to share/cvc-scenes/shared/kenney-cars/ next to the
    Humvee so demos resolve them via the same sibling
    <bundle>/../../shared/ path. Gives the nav demos a fleet of distinct,
    real-proportion civilian vehicle bodies instead of one Humvee everywhere.

source:
  type: none

patches: []

depends:
  build: []
  runtime: []
  host_tools: []

build:
  build_type_independent: true
  matrix:
    - platform: any
      script: build.sh

package:
  files:
    - share/cvc-scenes/shared/kenney-cars/ambulance.glb
    - share/cvc-scenes/shared/kenney-cars/box.glb
