notes:
  - title: "Provenance and licence"
    platforms: [any]
    description: >-
      Kenney Car Kit 3.1 (kenney.nl), CC0 1.0. The bundled LICENSE.txt is
      Kenney's own notice. Only the models/ set is shipped; the kit's duplicate
      top-level race.glb is omitted. Packed with cvcpkg pack --from-prefix from
      the catx-03 mirror at /opt/cvc-wasm/scenes/shared/kenney-cars/.
  - title: "Consumers"
    platforms: [any]
    description: >-
      Same install root as vehicle-humvee, so anything that already finds
      shared/Humvee.glb via <bundle>/../../shared/ can pick a body from
      shared/kenney-cars/<name>.glb with no new path plumbing.
